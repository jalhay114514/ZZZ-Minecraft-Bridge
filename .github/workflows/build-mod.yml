name: Build ZZZ-MC Bridge MOD

on:
  workflow_dispatch:
  push:
    paths:
      - 'minecraft-mod/**'
      - '.github/workflows/build-mod.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-mod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric MOD
        run: gradle build --no-daemon

      - name: Upload MOD JAR
        uses: actions/upload-artifact@v4
        with:
          name: zzz-mc-bridge-0.3.3
          path: minecraft-mod/build/libs/*.jar
          if-no-files-found: error
